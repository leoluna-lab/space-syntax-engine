<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf8f2">
<meta name="description" content="Análise configuracional de espaços convexos (Hillier & Hanson) no navegador.">
<title>Space Syntax Engine</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body data-view="graph">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="i-projector" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><path d="M6 3l12 8-5.5 1.5L10 18z"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><path d="M9 12h6"/></symbol>
  <symbol id="i-poly" viewBox="0 0 24 24"><path d="M12 3l8 6-3 11H7L4 9z"/></symbol>
  <symbol id="i-zin" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M11 8v6M8 11h6"/></symbol>
  <symbol id="i-zout" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11h6"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-draw" viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/></symbol>
  <symbol id="i-jgraph" viewBox="0 0 24 24"><circle cx="12" cy="19" r="2"/><circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><path d="M12 17v-3M10.6 10.6 7.2 6.5M13.4 10.6l3.4-4.1"/></symbol>
  <symbol id="i-results" viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="5" width="7" height="14" rx="1"/><rect x="14" y="5" width="7" height="14" rx="1"/></symbol>
  <symbol id="i-model" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-root" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></symbol>
</svg>

<div class="app">
  <header class="appbar">
    <div class="brand">Space Syntax Engine<small data-i18n="brand.sub"></small></div>
    <select id="scnSel" class="scnsel" data-i18n-aria="scn.select"></select>
    <nav class="toptabs" role="tablist">
      <button class="tab" role="tab" data-view="graph" data-i18n="tab.graph"></button>
      <button class="tab" role="tab" data-view="jgraph" data-i18n="tab.jgraph"></button>
      <button class="tab" role="tab" data-view="results" data-i18n="tab.results"></button>
      <button class="tab" role="tab" data-view="compare" data-i18n="tab.compare"></button>
    </nav>
    <div class="spacer"></div>
    <button class="icon" id="btnUndo" data-i18n-aria="undo"><svg class="ico"><use href="#i-undo"/></svg></button>
    <button class="icon" id="btnRedo" data-i18n-aria="redo"><svg class="ico"><use href="#i-redo"/></svg></button>
    <button class="icon" id="btnProjector" aria-pressed="false" data-i18n-aria="projector"><svg class="ico"><use href="#i-projector"/></svg></button>
    <button class="icon lang" id="btnLang" data-i18n-aria="lang.switch"></button>
  </header>

  <aside class="panel" id="panel">
    <details class="grp" open id="grpScn">
      <summary><span data-i18n="grp.scn"></span> <span id="sCount" class="count"></span></summary>
      <div class="row"><span class="lbl" data-i18n="scn.rename"></span><input type="text" id="scnName" maxlength="80"></div>
      <div class="list" id="scnList" style="max-height:11rem"></div>
      <div class="btnrow"><button class="ghost" id="scnDup" data-i18n="scn.dup"></button><button class="ghost" id="scnNew" data-i18n="scn.new"></button></div>
      <p class="hint" data-i18n="hint.scn"></p>
    </details>

    <details class="grp" open>
      <summary data-i18n="grp.root"></summary>
      <select id="rootSel"></select>
      <p class="hint" data-i18n="hint.root"></p>
    </details>

    <details class="grp" open>
      <summary><span data-i18n="grp.spaces"></span> <span id="nCount" class="count"></span></summary>
      <p class="hint" style="margin:0 0 .4rem" data-i18n="hint.spaces"></p>
      <div class="list" id="nodeList"></div>
      <div class="row"><input type="text" id="newName" maxlength="200" data-i18n-ph="ph.newName"><button id="addNode" data-i18n="btn.add"></button></div>
    </details>

    <details class="grp" open>
      <summary><span data-i18n="grp.links"></span> <span id="eCount" class="count"></span></summary>
      <div class="row"><select id="edgeA"></select><span aria-hidden="true">↔</span><select id="edgeB"></select><button id="addEdge" data-i18n="btn.link"></button></div>
      <div class="list" id="edgeList" style="max-height:10rem"></div>
    </details>

    <details class="grp">
      <summary data-i18n="grp.view"></summary>
      <label class="chk"><input type="checkbox" id="optSnap"> <span data-i18n="opt.snap"></span></label>
      <label class="chk"><input type="checkbox" id="optValues"> <span data-i18n="opt.values"></span></label>
      <div class="row"><span class="lbl" data-i18n="opt.radius"></span><input type="number" id="optRadius" min="0" max="20" step="1" value="0" inputmode="numeric"></div>
      <p class="hint" data-i18n="hint.radius"></p>
    </details>

    <details class="grp">
      <summary data-i18n="grp.conv"></summary>
      <div class="row"><span class="lbl" data-i18n="conv.entropy"></span>
        <select id="optEntropy"><option value="depthmapx" data-i18n="conv.entropy.dm"></option><option value="excludeSelf" data-i18n="conv.entropy.v1"></option></select></div>
      <div class="row"><span class="lbl" data-i18n="conv.h"></span>
        <select id="optHFactor"><option value="ra" data-i18n="conv.h.ra"></option><option value="integration" data-i18n="conv.h.int"></option></select></div>
      <p class="hint" data-i18n="hint.conv"></p>
    </details>

    <details class="grp">
      <summary data-i18n="grp.bg"></summary>
      <div class="row"><input type="file" id="bgFile" accept="image/*" style="font-size:.72rem"></div>
      <div id="bgControls" hidden>
        <div class="row"><span class="lbl" data-i18n="bg.opacity"></span><input type="range" id="bgOp" min="0.05" max="1" step="0.05" value="0.5"></div>
        <div class="row"><span class="lbl" data-i18n="bg.rotate"></span><input type="range" id="bgRot" min="-180" max="180" step="1" value="0"></div>
        <div class="row"><span class="lbl" data-i18n="bg.scale"></span><input type="range" id="bgScale" min="0.3" max="3" step="0.02" value="1"></div>
        <div class="row"><span class="lbl" data-i18n="bg.dx"></span><input type="range" id="bgDx" min="-300" max="300" step="2" value="0"></div>
        <div class="row"><span class="lbl" data-i18n="bg.dy"></span><input type="range" id="bgDy" min="-300" max="300" step="2" value="0"></div>
        <div class="btnrow"><button class="danger" id="bgClear" data-i18n="bg.remove"></button></div>
      </div>
      <p class="hint" data-i18n="hint.bg"></p>
    </details>

    <details class="grp">
      <summary data-i18n="grp.convex"></summary>
      <div class="btnrow"><button class="ghost" id="btnDerive" data-i18n="btn.derive"></button></div>
      <p class="hint" data-i18n="hint.convex"></p>
    </details>

    <details class="grp">
      <summary data-i18n="grp.export"></summary>
      <div class="btnrow">
        <button class="ghost" id="exCSV" data-i18n="ex.csv"></button>
        <button class="ghost" id="exPNG" data-i18n="ex.png"></button>
        <button class="ghost" id="exPNGJ" data-i18n="ex.pngj"></button>
      </div>
      <div class="btnrow">
        <button class="ghost" id="exCopy" data-i18n="ex.copy"></button>
        <button class="ghost" id="exPrint" data-i18n="ex.print"></button>
      </div>
    </details>

    <details class="grp" id="grpIO">
      <summary data-i18n="grp.io"></summary>
      <div class="btnrow"><button class="ghost" id="btnExport" data-i18n="io.export"></button><button class="ghost" id="btnLoad" data-i18n="io.load"></button></div>
      <textarea id="io" spellcheck="false" data-i18n-ph="ph.io" style="margin-top:.4rem"></textarea>
      <div class="note" id="ioNote" hidden></div>
      <div class="warn" id="ioWarn" hidden style="margin-top:.5rem"></div>
      <div class="btnrow"><button class="ghost" id="btnReset" data-i18n="io.reset"></button></div>
    </details>
  </aside>

  <main>
    <section class="view" id="view-graph" role="tabpanel">
      <div class="viewhead">
        <label class="measure-pick"><span data-i18n="colourBy"></span><select id="measureSel"></select></label>
        <button class="icon" id="measureInfo" data-i18n-aria="aboutMeasure"><svg class="ico"><use href="#i-info"/></svg></button>
        <div class="legend" aria-hidden="true"><span id="legLo"></span><span class="ramp"></span><span id="legHi"></span></div>
      </div>
      <div class="warn" id="warnBox" hidden></div>
      <div class="canvaswrap">
        <svg class="graph" id="svgGraph" viewBox="0 0 760 480" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="modes" role="toolbar">
          <button class="modebtn" data-mode="select" data-i18n-aria="mode.select"><svg class="ico"><use href="#i-select"/></svg><span data-i18n="mode.select"></span></button>
          <button class="modebtn" data-mode="add" data-i18n-aria="mode.add"><svg class="ico"><use href="#i-add"/></svg><span data-i18n="mode.add"></span></button>
          <button class="modebtn" data-mode="link" data-i18n-aria="mode.link"><svg class="ico"><use href="#i-link"/></svg><span data-i18n="mode.link"></span></button>
          <button class="modebtn" data-mode="poly" data-i18n-aria="mode.poly"><svg class="ico"><use href="#i-poly"/></svg><span data-i18n="mode.poly"></span></button>
        </div>
        <div class="zoom">
          <button class="icon" id="zoomIn" data-i18n-aria="zoom.in"><svg class="ico"><use href="#i-zin"/></svg></button>
          <button class="icon" id="zoomOut" data-i18n-aria="zoom.out"><svg class="ico"><use href="#i-zout"/></svg></button>
          <button class="icon" id="zoomFit" data-i18n-aria="zoom.fit"><svg class="ico"><use href="#i-fit"/></svg></button>
        </div>
        <div class="ctxbar" id="ctxBar" hidden></div>
      </div>
      <p class="foot desk-only" data-i18n="help.graph"></p>
    </section>

    <section class="view" id="view-jgraph" role="tabpanel">
      <div class="canvaswrap"><svg class="graph" id="svgJ" viewBox="0 0 760 480" preserveAspectRatio="xMidYMid meet"></svg></div>
      <p class="foot" data-i18n="help.jgraph"></p>
    </section>

    <section class="view" id="view-results" role="tabpanel">
      <div class="valbox" id="valBox"></div>
      <div class="cards" id="globalCards"></div>
      <div class="valbox funcbox" id="funcBox"></div>
      <label class="sortbar"><span data-i18n="sortBy"></span><select id="sortSel"></select></label>
      <div class="tablewrap"><table id="resTable"><thead></thead><tbody></tbody></table></div>
      <div class="spacecards" id="spaceCards"></div>
      <p class="foot" id="methodFoot"></p>
    </section>

    <section class="view" id="view-compare" role="tabpanel">
      <div class="cmp-head">
        <div class="seg" role="tablist" id="cmpViews">
          <button role="tab" data-cv="maps" data-i18n="cv.maps"></button>
          <button role="tab" data-cv="table" data-i18n="cv.table"></button>
          <button role="tab" data-cv="delta" data-i18n="cv.delta"></button>
          <button role="tab" data-cv="jgraph" data-i18n="cv.jgraph"></button>
        </div>
        <label class="measure-pick"><span data-i18n="colourBy"></span><select id="cmpMeasure"></select></label>
      </div>
      <div class="chips" id="cmpChips"></div>
      <div id="compareBox"></div>
    </section>
  </main>

  <nav class="bottomnav" role="tablist">
    <button role="tab" data-view="graph"><svg class="ico"><use href="#i-draw"/></svg><span data-i18n="nav.graph"></span></button>
    <button role="tab" data-view="jgraph"><svg class="ico"><use href="#i-jgraph"/></svg><span data-i18n="nav.jgraph"></span></button>
    <button role="tab" data-view="results"><svg class="ico"><use href="#i-results"/></svg><span data-i18n="nav.results"></span></button>
    <button role="tab" data-view="compare"><svg class="ico"><use href="#i-compare"/></svg><span data-i18n="nav.compare"></span></button>
    <button role="tab" data-view="model"><svg class="ico"><use href="#i-model"/></svg><span data-i18n="nav.model"></span></button>
  </nav>
</div>

<section class="sheet" id="sheet" hidden aria-live="polite"></section>
<datalist id="labelOptions"></datalist>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
<dialog class="infodlg" id="infoDlg"></dialog>
<div class="tip" id="tip"></div>
<div id="ovl">
  <div class="ohint" id="ovlHint"></div>
  <img id="ovlImg" alt="">
  <div class="obar"><a class="dl" id="ovlDl" download data-i18n="ovl.download"></a><button id="ovlClose" data-i18n="ovl.close"></button></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
